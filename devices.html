<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการเครื่องมือ - ระบบบริหารจัดการเครื่องมือแพทย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold">MedEquip Center</span>
                    <div class="hidden md:flex space-x-2">
                        <a href="dashboard.html" class="hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">ภาพรวม (Dashboard)</a>
                        <a href="devices.html" class="bg-blue-900 px-3 py-2 rounded-md text-sm font-medium">จัดการเครื่องมือ (Devices)</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md text-sm transition">ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">ทะเบียนเครื่องมือแพทย์</h1>
            <button id="btnOpenModal" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg shadow-sm font-medium transition">+ เพิ่มเครื่องมือใหม่</button>
        </div>

        <div id="addDeviceSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
            <h2 class="text-lg font-bold text-slate-700 mb-4">ฟอร์มลงทะเบียนเครื่องมือใหม่</h2>
            <form id="addDeviceForm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm text-slate-600">รหัสเครื่อง (Device ID)</label>
                        <input type="text" id="devId" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="text-sm text-slate-600">ชื่อเครื่องมือ (Name)</label>
                        <input type="text" id="devName" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="text-sm text-slate-600">หมวดหมู่ (Category)</label>
                        <select id="devCat" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500">
                            <option value="Life Support">Life Support (ช่วยชีวิต)</option>
                            <option value="Monitor">Monitor (เฝ้าระวัง)</option>
                            <option value="Treatment">Treatment (รักษา)</option>
                            <option value="General">General (ทั่วไป)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-slate-600">สถานะเริ่มต้น (Status)</label>
                        <select id="devStatus" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500">
                            <option value="พร้อมใช้">พร้อมใช้</option>
                            <option value="ส่งซ่อม">ส่งซ่อม</option>
                            <option value="ถูกยืม">ถูกยืม</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-slate-600">แผนกเจ้าของเครื่อง (Department)</label>
                        <input type="text" id="devDept" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" required>
                    </div>
                    <div>
                        <label class="text-sm text-slate-600">สถานที่ติดตั้ง/จัดเก็บ (Location)</label>
                        <input type="text" id="devLoc" class="w-full border p-2 rounded mt-1 outline-none focus:border-blue-500" required>
                    </div>
                </div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" id="btnCancel" class="bg-slate-200 text-slate-700 px-4 py-2 rounded hover:bg-slate-300">ยกเลิก</button>
                    <button type="submit" id="btnSaveDevice" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">บันทึกข้อมูล</button>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">Device ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">ชื่อเครื่องมือ</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">หมวดหมู่</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">แผนก</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">สถานะ</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody" class="bg-white divide-y divide-slate-200">
                    <tr><td colspan="5" class="px-6 py-4 text-center text-slate-500">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth(); // เช็คสิทธิ์ก่อน

        // โหลดข้อมูลมาแสดงในตาราง
        async function loadDevices() {
            const tbody = document.getElementById('deviceTableBody');
            
            // เรียก API ดึงข้อมูล
            const res = await callAPI({ action: 'getDevices' });
            
            tbody.innerHTML = ''; // ล้างค่าเดิม
            
            if (res && res.success && res.data && res.data.length > 0) {
                res.data.forEach(d => {
                    // กำหนดสีให้สถานะ
                    let statusColor = 'bg-slate-100 text-slate-800'; // Default
                    if (d.Status === 'พร้อมใช้') statusColor = 'bg-emerald-100 text-emerald-800';
                    else if (d.Status === 'ส่งซ่อม') statusColor = 'bg-red-100 text-red-800';
                    else if (d.Status === 'ถูกยืม') statusColor = 'bg-amber-100 text-amber-800';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">${d.DeviceID || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700">${d.Name || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${d.Category || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${d.Department || '-'}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">${d.Status || '-'}</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-slate-500">ยังไม่มีข้อมูลเครื่องมือในระบบ</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('userRole');
            
            // ถ้าไม่ใช่ Guest ให้แสดงปุ่มเพิ่มอุปกรณ์
            if (role !== 'guest') {
                document.getElementById('btnOpenModal').classList.remove('hidden');
            }

            loadDevices(); // โหลดข้อมูลลงตารางตอนเปิดหน้า
        });

        // เปิด-ปิด ฟอร์มเพิ่มข้อมูล
        document.getElementById('btnOpenModal').addEventListener('click', () => {
            document.getElementById('addDeviceSection').classList.remove('hidden');
        });
        document.getElementById('btnCancel').addEventListener('click', () => {
            document.getElementById('addDeviceSection').classList.add('hidden');
            document.getElementById('addDeviceForm').reset();
        });

        // จัดการการส่งฟอร์มเพิ่มเครื่องมือ
        document.getElementById('addDeviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSaveDevice');
            btn.innerText = 'กำลังบันทึก...';
            btn.disabled = true;
            
            const payload = {
                action: 'addDevice',
                deviceId: document.getElementById('devId').value,
                name: document.getElementById('devName').value,
                category: document.getElementById('devCat').value,
                status: document.getElementById('devStatus').value,
                department: document.getElementById('devDept').value,
                location: document.getElementById('devLoc').value,
                lastPm: '-' // ค่าเริ่มต้นวันที่ซ่อมบำรุง
            };

            const res = await callAPI(payload);
            
            if(res && res.success) {
                alert(res.message);
                document.getElementById('addDeviceForm').reset();
                document.getElementById('addDeviceSection').classList.add('hidden');
                loadDevices(); // โหลดข้อมูลในตารางใหม่ทันที
            } else {
                alert("เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง");
            }
            
            btn.innerText = 'บันทึกข้อมูล';
            btn.disabled = false;
        });
    </script>
</body>
</html>
