<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบบริหารจัดการเครื่องมือแพทย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md relative">
        <div class="text-center mb-6">
            <h2 id="formTitle" class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ</h2>
            <p class="text-sm text-slate-500 mt-1">ระบบบริหารจัดการเครื่องมือแพทย์</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="loginUser" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="loginPass" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-blue-500" required>
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700">เข้าสู่ระบบ</button>
            
            <div class="flex items-center justify-between text-sm mt-4">
                <a href="#" onclick="toggleForm('register')" class="text-blue-600 font-medium hover:underline">สมัครสมาชิกใหม่</a>
                <a href="#" onclick="toggleForm('forgot')" class="text-slate-500 hover:underline">ลืมรหัสผ่าน?</a>
            </div>
            
            <hr class="my-4">
            <button type="button" onclick="guestLogin()" class="w-full bg-slate-100 text-slate-700 font-medium py-2.5 rounded-lg border hover:bg-slate-200">เข้าชมระบบแบบ Guest</button>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
            <div><label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้งาน</label><input type="text" id="regUser" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-emerald-500" required></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label><input type="email" id="regEmail" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-emerald-500" required></div>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label><input type="password" id="regPass" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-emerald-500" required></div>
            
            <div class="flex items-start bg-slate-50 p-3 rounded-lg border mt-2">
                <input type="checkbox" id="pdpaConsent" class="mt-1 mr-2" required>
                <label for="pdpaConsent" class="text-xs text-slate-600">ข้าพเจ้ายินยอมให้ระบบประมวลผลข้อมูลส่วนบุคคล (อีเมลและชื่อผู้ใช้) เพื่อใช้งานในระบบ ตามนโยบาย PDPA</label>
            </div>

            <button type="submit" id="btnReg" class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-700">ยืนยันสมัครสมาชิก</button>
            <div class="text-center pt-2"><a href="#" onclick="toggleForm('login')" class="text-sm text-slate-500 hover:text-slate-800">ย้อนกลับไปหน้าเข้าสู่ระบบ</a></div>
        </form>

        <form id="forgotForm" class="space-y-4 hidden">
            <p class="text-sm text-amber-800 bg-amber-50 p-3 rounded-lg border">ระบบจะทำการสุ่มรหัสผ่านใหม่ และส่งไปยังอีเมลที่ลงทะเบียนไว้</p>
            <div><label class="block text-sm font-medium text-slate-700 mb-1">อีเมลที่ลงทะเบียน</label><input type="email" id="forgotEmail" class="w-full px-4 py-2 border rounded-lg outline-none focus:border-amber-500" required></div>
            <button type="submit" id="btnForgot" class="w-full bg-amber-500 text-white font-medium py-2.5 rounded-lg hover:bg-amber-600">ส่งรหัสผ่านใหม่</button>
            <div class="text-center pt-2"><a href="#" onclick="toggleForm('login')" class="text-sm text-slate-500 hover:text-slate-800">ย้อนกลับไปหน้าเข้าสู่ระบบ</a></div>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        function toggleForm(type) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            if(type === 'login') { document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'เข้าสู่ระบบ'; }
            if(type === 'register') { document.getElementById('registerForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'ลงทะเบียนผู้ใช้ใหม่'; }
            if(type === 'forgot') { document.getElementById('forgotForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'ลืมรหัสผ่าน'; }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin'); btn.innerText = 'กำลังตรวจสอบ...'; btn.disabled = true;
            const res = await callAPI({ action: 'login', username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value });
            if(res && res.success) {
                localStorage.setItem('userRole', res.role); localStorage.setItem('username', res.username);
                window.location.href = 'dashboard.html';
            } else {
                alert(res.message); btn.innerText = 'เข้าสู่ระบบ'; btn.disabled = false;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReg'); btn.innerText = 'กำลังบันทึก...'; btn.disabled = true;
            const res = await callAPI({ action: 'register', username: document.getElementById('regUser').value, email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value });
            alert(res.message);
            if(res && res.success) { document.getElementById('registerForm').reset(); toggleForm('login'); }
            btn.innerText = 'ยืนยันสมัครสมาชิก'; btn.disabled = false;
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnForgot'); btn.innerText = 'กำลังส่งอีเมล...'; btn.disabled = true;
            const res = await callAPI({ action: 'forgotPassword', email: document.getElementById('forgotEmail').value });
            alert(res.message); btn.innerText = 'ส่งรหัสผ่านใหม่'; btn.disabled = false;
        });

        function guestLogin() {
            localStorage.setItem('userRole', 'guest'); localStorage.setItem('username', 'Guest');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
