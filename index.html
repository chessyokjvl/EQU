<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - MedEquip Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md relative">
        <div class="text-center mb-6">
            <h2 id="formTitle" class="text-2xl font-bold text-blue-900">เข้าสู่ระบบ</h2>
            <p class="text-sm text-slate-500 mt-1">MedEquip - ระบบบริหารจัดการเครื่องมือแพทย์</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div><label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ใช้งาน</label><input type="text" id="loginUser" class="w-full px-4 py-2 border border-slate-300 rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required></div>
            <div><label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน</label><input type="password" id="loginPass" class="w-full px-4 py-2 border border-slate-300 rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" required></div>
            <button type="submit" id="btnLogin" class="w-full bg-blue-600 text-white font-medium py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/30 transition">เข้าสู่ระบบ</button>
            
            <div class="flex items-center justify-between text-sm mt-4">
                <a href="#" onclick="toggleForm('register')" class="text-blue-600 font-medium hover:underline">สมัครสมาชิกใหม่</a>
                <a href="#" onclick="toggleForm('forgot')" class="text-slate-500 hover:underline">ลืมรหัสผ่าน?</a>
            </div>
            
            <div class="relative flex py-5 items-center">
                <div class="flex-grow border-t border-slate-200"></div><span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wider">หรือ</span><div class="flex-grow border-t border-slate-200"></div>
            </div>
            <button type="button" onclick="guestLogin()" class="w-full bg-white text-slate-700 font-medium py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 transition">เข้าชมระบบแบบ Guest</button>
        </form>

        <form id="registerForm" class="space-y-4 hidden">
            <div><label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ใช้งาน</label><input type="text" id="regUser" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500" required></div>
            <div><label class="block text-sm font-semibold text-slate-700 mb-1">อีเมล</label><input type="email" id="regEmail" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500" required></div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">หน่วยงานที่สังกัด (วอร์ด/แผนก)</label>
                <input type="text" id="regDept" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500" placeholder="เช่น ER, OPD, แผนกเภสัชกรรม" required>
            </div>

            <div><label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน</label><input type="password" id="regPass" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-emerald-500" required></div>
            
            <div class="flex items-start bg-slate-50 p-3 rounded-xl border mt-2">
                <input type="checkbox" id="pdpaConsent" class="mt-1 mr-2" required>
                <label for="pdpaConsent" class="text-xs text-slate-600 leading-relaxed">ข้าพเจ้ายินยอมให้ระบบประมวลผลข้อมูลส่วนบุคคล เพื่อใช้งานในระบบตามนโยบาย PDPA</label>
            </div>

            <button type="submit" id="btnReg" class="w-full bg-emerald-600 text-white font-medium py-3 rounded-xl hover:bg-emerald-700 shadow-md shadow-emerald-500/30 transition">ยืนยันสมัครสมาชิก</button>
            <div class="text-center pt-2"><a href="#" onclick="toggleForm('login')" class="text-sm text-slate-500 hover:text-slate-800">ย้อนกลับไปหน้าเข้าสู่ระบบ</a></div>
        </form>

        <form id="forgotForm" class="space-y-4 hidden">
            <p class="text-sm text-amber-800 bg-amber-50 p-4 rounded-xl border border-amber-200">ระบบจะทำการสุ่มรหัสผ่านใหม่ และส่งไปยังอีเมลที่ลงทะเบียนไว้</p>
            <div><label class="block text-sm font-semibold text-slate-700 mb-1 mt-2">อีเมลที่ลงทะเบียน</label><input type="email" id="forgotEmail" class="w-full px-4 py-2 border rounded-xl outline-none focus:border-amber-500" required></div>
            <button type="submit" id="btnForgot" class="w-full bg-amber-500 text-white font-medium py-3 rounded-xl hover:bg-amber-600 shadow-md shadow-amber-500/30 transition">ส่งรหัสผ่านใหม่</button>
            <div class="text-center pt-2"><a href="#" onclick="toggleForm('login')" class="text-sm text-slate-500 hover:text-slate-800">ย้อนกลับไปหน้าเข้าสู่ระบบ</a></div>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        function toggleForm(type) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            if(type === 'login') { document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'เข้าสู่ระบบ'; }
            if(type === 'register') { document.getElementById('registerForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'ลงทะเบียนผู้ใช้ใหม่'; }
            if(type === 'forgot') { document.getElementById('forgotForm').classList.remove('hidden'); document.getElementById('formTitle').innerText = 'ลืมรหัสผ่าน'; }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin'); btn.innerText = 'กำลังตรวจสอบ...'; btn.disabled = true;
            const res = await callAPI({ action: 'login', username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value });
            if(res && res.success) {
                localStorage.setItem('userRole', res.role); localStorage.setItem('username', res.username);
                window.location.href = 'dashboard.html';
            } else { alert(res.message); btn.innerText = 'เข้าสู่ระบบ'; btn.disabled = false; }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReg'); btn.innerText = 'กำลังบันทึก...'; btn.disabled = true;
            
            // ส่ง Department ไปด้วย
            const payload = { 
                action: 'register', 
                username: document.getElementById('regUser').value, 
                email: document.getElementById('regEmail').value, 
                password: document.getElementById('regPass').value,
                department: document.getElementById('regDept').value // ฟิลด์ใหม่
            };
            
            const res = await callAPI(payload);
            alert(res.message);
            if(res && res.success) { document.getElementById('registerForm').reset(); toggleForm('login'); }
            btn.innerText = 'ยืนยันสมัครสมาชิก'; btn.disabled = false;
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnForgot'); btn.innerText = 'กำลังส่งอีเมล...'; btn.disabled = true;
            const res = await callAPI({ action: 'forgotPassword', email: document.getElementById('forgotEmail').value });
            alert(res.message); btn.innerText = 'ส่งรหัสผ่านใหม่'; btn.disabled = false;
        });

        function guestLogin() {
            localStorage.setItem('userRole', 'guest'); localStorage.setItem('username', 'Guest');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
