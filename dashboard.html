<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ระบบจัดการเครื่องมือแพทย์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex space-x-4">
                <span class="text-xl font-bold">MedEquip</span>
                <a href="dashboard.html" class="bg-blue-900 px-3 py-2 rounded-md text-sm font-medium">ภาพรวม (Dashboard)</a>
                <a href="devices.html" class="hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium">จัดการเครื่องมือ (Devices)</a>
            </div>
            <div class="flex space-x-4 items-center">
                <span id="displayUser" class="text-sm text-blue-200"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md text-sm">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">ภาพรวมระบบ (Executive Dashboard)</h1>
        <div id="guestWarning" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 mb-6 rounded-r-md">
            <p class="text-amber-800 text-sm">คุณเข้าชมในฐานะ Guest จะสามารถดูภาพรวมได้เท่านั้น</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-sm p-6 border"><p class="text-sm font-medium text-slate-500">ทั้งหมด</p><p class="text-3xl font-bold text-blue-600 mt-2" id="statTotal">0</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border"><p class="text-sm font-medium text-slate-500">สถานะ: ปกติ</p><p class="text-3xl font-bold text-emerald-600 mt-2" id="statReady">0</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border"><p class="text-sm font-medium text-slate-500">สถานะ: ชำรุด</p><p class="text-3xl font-bold text-red-500 mt-2" id="statRepair">0</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border"><p class="text-sm font-medium text-slate-500">สถานะ: ยกเลิก</p><p class="text-3xl font-bold text-slate-500 mt-2" id="statCancel">0</p></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth();
        document.addEventListener('DOMContentLoaded', async () => {
            const role = localStorage.getItem('userRole');
            document.getElementById('displayUser').innerText = `${localStorage.getItem('username')} (${role})`;
            if (role === 'guest') document.getElementById('guestWarning').classList.remove('hidden');

            const res = await callAPI({ action: 'getDevices' });
            if (res && res.success && res.data) {
                const devices = res.data;
                document.getElementById('statTotal').innerText = devices.length;
                document.getElementById('statReady').innerText = devices.filter(d => d.Status === 'ปกติ').length;
                document.getElementById('statRepair').innerText = devices.filter(d => d.Status === 'ชำรุด').length;
                document.getElementById('statCancel').innerText = devices.filter(d => d.Status === 'ยกเลิก').length;
            }
        });
    </script>
</body>
</html>
